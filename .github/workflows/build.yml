name: Build H5P package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ctezlifrn/h5p-cli:latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build package
        run: npx h5p pack src H5P.CustomizableColumn-1.0.h5p

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: H5P.CustomizableColumn-1.0.h5p
          path: H5P.CustomizableColumn-1.0.h5p
